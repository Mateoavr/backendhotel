spring.application.name=backend

# Conexión a PostgreSQL (Se conecta a Neon.tech mediante variable de entorno o usa localhost de respaldo)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_valparaiso}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:clm292226}

# Pool de conexiones (Optimizado para Neon.tech - 30 conexiones concurrentes)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Hibernate (crea las tablas automáticamente basándose en tu código)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto de Render
server.port=${PORT:8080}